name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:assets
      - run: npm test
      - uses: actions/cache@v6
        with:
          path: _site/img
          # bump v1 to reset the image cache
          key: img-v1-${{ hashFiles('assets/**', 'eleventy.config.js', 'lib/**') }}
          restore-keys: img-v1-
      - run: npm run build
      - run: npm run prune:img
      - run: du -sh _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v5
